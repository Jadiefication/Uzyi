before_install:
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  - source $HOME/.cargo/env
  - rustup target add x86_64-unknown-linux-gnu
  - rustup target add x86_64-pc-windows-gnu
  # Note: macOS target requires a specialized toolchain not easily available on JitPack's default Linux environment.
  # We'll skip macOS cross-compilation on JitPack for now as it's not supported by default.
  - sudo apt-get update && sudo apt-get install -y mingw-w64
